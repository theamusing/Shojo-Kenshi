<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1012">
  <meta name="description" content="少女剑士：月下山寺的像素剑斗。">
  <title>少女剑士 · 月下山寺</title>
  <link rel="icon" href="./sprites/rika_610c3ece.png">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="月下山寺">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="A D 移动，J 攻击连段，K 格挡，H 判定框，Esc 暂停">你的浏览器不支持 Canvas。</canvas>
    <div id="loading" class="screen loading" role="status">正在进入山寺…</div>
    <div id="hud" class="hud">
      <div class="player-hud">
        <span class="fighter-name">剑士</span>
        <div class="health-track player-health" role="progressbar" aria-label="剑士生命" aria-valuemin="0" aria-valuemax="100" id="player-health"><i id="player-health-fill"></i></div>
      </div>
      <div class="boss-hud">
        <div class="boss-heading"><span class="ornament">◇</span><span class="fighter-name">红盔武士</span><span class="ornament">◇</span></div>
        <div class="health-track" role="progressbar" aria-label="红盔武士生命" aria-valuemin="0" aria-valuemax="600" id="boss-health"><i id="boss-health-fill"></i></div>
        <div class="posture-track" role="progressbar" aria-label="红盔武士韧性" aria-valuemin="0" aria-valuemax="60" id="boss-posture"><i id="boss-posture-fill"></i><b></b></div>
        <span id="difficulty-badge" class="difficulty-badge" aria-label="困难模式" hidden>难</span>
      </div>
    </div>
    <div id="scene-caption" class="scene-caption" hidden><span>雾 隐 幽 村</span><small>水声不歇，故人未归</small></div>
    <div id="boss-debug" class="boss-debug" hidden role="status"></div>
    <div id="instructions" class="instructions"><p><kbd>A</kbd> <kbd>D</kbd> 移动 <span>·</span> <kbd>J</kbd> 攻击 <span>·</span> <kbd>K</kbd> 格挡</p><small>再次按 J 连段 · Esc 暂停 · H 判定框</small></div>
    <button id="pause-button" class="pause-button" aria-label="暂停游戏">Ⅱ</button>
    <div class="touch-controls" id="touch-controls" aria-label="触屏操作">
      <div><button data-move="-1" aria-label="向左">←</button><button data-move="1" aria-label="向右">→</button></div>
      <div><button data-action="attack">攻</button><button data-action="defend">挡</button></div>
    </div>
    <div id="pause-overlay" class="screen pause-screen" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <p class="eyebrow">月 下 山 寺</p><h1 id="pause-title">暂歇</h1>
      <p class="subtle">A / D 移动　J 攻击　K 格挡</p>
      <div class="audio-settings">
        <label>音乐<input id="music-volume" type="range" min="0" max="100" value="32"></label>
        <label>音效<input id="effects-volume" type="range" min="0" max="100" value="85"></label>
        <button id="audio-mute" aria-pressed="false">静音</button>
      </div>
      <div class="scene-settings">
        <label for="scene-select">场景</label>
        <select id="scene-select"><option value="ghost">雾隐幽村 · 怨影</option><option value="samurai">月下山寺 · 红盔武士</option></select>
      </div>
      <div class="difficulty-settings">
        <label for="difficulty-select">难度</label>
        <select id="difficulty-select"><option value="normal">普通</option><option value="hard" id="hard-option" disabled>困难 · 尚未解锁</option></select>
        <span id="difficulty-hint">击败红盔武士解锁困难模式</span>
      </div>
      <div class="menu-actions"><button id="continue-game" class="primary">继续交锋</button><button id="restart-game">重新开始</button></div>
      <p id="pause-hint" class="subtle">切换难度后点击重新开始 · Esc 继续当前战斗</p>
    </div>
    <div id="death-overlay" class="screen death-screen" hidden role="dialog" aria-labelledby="death-title">
      <h1 id="death-title">死</h1><p class="eyebrow">败于此刻，再战此地</p><button id="death-restart" class="restart">点击任意位置或按任意键重新开始</button>
    </div>
    <div id="victory-overlay" class="screen victory-screen" hidden role="dialog" aria-labelledby="victory-title">
      <p class="eyebrow">月 下 山 寺</p><h1 id="victory-title">胜负已分</h1><div class="result-line"></div>
      <dl><div><dt>战斗时间</dt><dd id="result-time"></dd></div><div><dt>无伤达成</dt><dd id="result-flawless"></dd></div></dl>
      <p id="unlock-message" class="unlock-message" hidden>困难模式已解锁</p>
      <div class="menu-actions"><button id="victory-restart" class="primary">再战一场</button><button id="challenge-hard" hidden>挑战困难</button></div>
    </div>
    <p id="audio-status" class="audio-status" role="status" hidden></p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
